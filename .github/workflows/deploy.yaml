name: Deploy Knowledge Base

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

jobs:

  test:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm install

      - name: Run validation scripts
        run: |
          node script/url-checker.js
          node script/lint-links.js
          node script/validate-docs.js

  build:
    needs: test
    runs-on: ubuntu-latest

    env:
      NODE_ENV: production

    outputs:
      site_url: ${{ steps.set-url.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm install

      - name: Build static site
        run: npm run eleventy:prod

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Set deployment URL
        id: set-url
        run: |
          echo "page_url=https://${{ github.repository_owner }}.github.io/ejemplo_git/" >> $GITHUB_OUTPUT

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ needs.build.outputs.site_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Create summary issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh issue create \
            --repo "$GH_REPO" \
            --title "Deployment Summary" \
            --body "GitHub Pages deployment completed successfully.

            Site URL:
            ${{ needs.build.outputs.site_url }}

            Repository:
            https://github.com/${{ github.repository }}

            Commit:
            ${{ github.sha }}"